name: Link check

# The site links to third party downloads and documentation that can move or disappear without us
# touching anything, and the Windows installer URL is built from the configured version number, so a
# release that never uploaded its asset would leave a dead download button.
#
# This is deliberately NOT part of the Frontend workflow. That one runs on every pull request across
# five browsers; making it depend on third party servers being up would fail unrelated pull requests
# for reasons no author can fix. So the check runs on a schedule, and on pull requests only when
# something that decides a link actually changes.
on:
  schedule:
    # Daily. Link rot is not urgent, but it should not wait for someone to notice.
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/config/CryfsVersion.ts'
      - 'frontend/components/modals/Download.tsx'
      - 'frontend/e2e/link-check/**'
      - 'frontend/playwright.linkcheck.config.ts'
      - '.github/workflows/link-check.yml'

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  link-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install playwright browser
        run: npx playwright install --with-deps chromium

      - name: Check links
        run: npm run test:links
